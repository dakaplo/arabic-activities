<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recognizing al-ism al-manṣūb: Circus Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F6F2; --surface:#FFF; --ink:#1A1A18; --muted:#6B6B5E; --rule:#D9D8D0;
    --accent:#1D3A6B; --tint:#E4EAF6;
    --ok:#2E6B1D; --ok-tint:#E4F0DC; --bad:#9B2226; --bad-tint:#F8E3E3;
    --hl:#FFF1C2;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding:32px 20px 60px; }
  .wrap { max-width:820px; margin:0 auto; }
  header { text-align:center; margin-bottom:24px; }
  .title-ar { font-family:'Noto Naskh Arabic',serif; font-size:clamp(1.6rem,4vw,2.2rem); font-weight:700; line-height:1.5; direction:rtl; }
  .subtitle { margin-top:6px; font-size:0.9rem; color:var(--muted); line-height:1.5; }
  .back { display:inline-block; margin-bottom:14px; font-size:0.8rem; color:var(--muted); text-decoration:none; }
  .back:hover { color:var(--ink); }
  .panel { background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:20px; margin-bottom:20px; }
  figure { text-align:center; margin-bottom:16px; }
  figure img { max-width:220px; width:60%; border-radius:6px; border:1px solid var(--rule); }
  figcaption { font-size:0.78rem; color:var(--muted); margin:8px auto 0; max-width:48ch; line-height:1.45; }
  .passage { direction:rtl; font-family:'Noto Naskh Arabic',serif; font-size:1.45rem; line-height:2.5; text-align:right; }
  .passage .w { font-weight:700; background:var(--hl); border-radius:6px; padding:2px 6px; cursor:pointer; border:0; font:inherit; font-weight:700; color:inherit; }
  .passage .w.active { outline:2px solid var(--accent); }
  .passage .w.done { background:var(--ok-tint); color:var(--ok); }
  .passage .w sup { font-family:'DM Sans',sans-serif; font-size:0.55rem; margin-right:3px; color:var(--muted); }
  .score-bar { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; color:var(--muted); border-bottom:1px solid var(--rule); margin-bottom:16px; }
  .score-bar strong { color:var(--ink); }
  .reset { font:inherit; font-size:0.8rem; border:1.5px solid var(--rule); background:transparent; border-radius:20px; padding:5px 13px; cursor:pointer; color:var(--ink); }
  .reset:hover { background:var(--ink); color:#fff; border-color:var(--ink); }
  .q-card { background:var(--surface); border:1px solid var(--rule); border-left:4px solid var(--accent); border-radius:10px; padding:18px 20px; margin-bottom:16px; scroll-margin-top:70px; }
  .q-card.active { box-shadow:0 0 0 2px var(--tint); }
  .q-head { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; }
  .q-num { font-size:0.75rem; font-weight:600; color:var(--muted); }
  .q-word { font-family:'Noto Naskh Arabic',serif; font-size:1.8rem; font-weight:700; direction:rtl; line-height:1.4; }
  .q-label { font-size:0.8rem; font-weight:600; color:var(--accent); margin:10px 0 6px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opt { font:inherit; font-size:0.88rem; text-align:left; padding:9px 12px; border:1.5px solid var(--rule); border-radius:8px; background:var(--surface); cursor:pointer; color:var(--ink); transition:background .12s,border-color .12s; }
  .opt:hover:not(:disabled) { background:var(--tint); border-color:var(--accent); }
  .opt.right { background:var(--ok-tint); border-color:var(--ok); color:var(--ok); font-weight:600; }
  .opt.wrong { background:var(--bad-tint); border-color:var(--bad); color:var(--bad); text-decoration:line-through; }
  .opt:disabled { cursor:default; }
  .opt:disabled:not(.right):not(.wrong) { opacity:.55; }
  .final { display:none; text-align:center; font-size:1.05rem; padding:24px; }
  .final.show { display:block; }
  @media (max-width:560px) { .opts { grid-template-columns:1fr; } .passage { font-size:1.25rem; } body { padding:20px 14px 50px; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; All activities</a>
  <header>
    <div class="title-ar">الاِسْم المَنْصوب</div>
    <p class="subtitle">Read the passage. For each highlighted indefinite noun or adjective, choose its meaning and the reason it is manṣūb.</p>
  </header>

  <div class="panel">
    <figure>
      <img src="mansub-circus-poster.jpeg" alt="Poster for the 1960 film Gharaam fi al-siirk">
      <figcaption>Poster from the 1960 film <em>Gharaam fi al-siirk</em> (Romance at the Circus) with a drawing of a <em>bahlawaan</em> (acrobat/circus performer)</figcaption>
    </figure>
    <div class="passage" id="passage"></div>
  </div>

  <div class="score-bar">
    <span>First-try correct: <strong id="score">0</strong> / <strong id="total">0</strong></span>
    <button class="reset" id="reset">Start over</button>
  </div>

  <div id="cards"></div>
  <div class="panel final" id="final"></div>
</div>

<script>
const REASONS = {
  time:   'Answers when? (adverb of time)',
  how:    'Answers how? (adverb)',
  be:     'Answers what? (predicate of be)',
  obj:    'Answers what? (direct object)',
  become: 'Answers what? (predicate of become)',
  agree:  'Agrees with the noun it describes',
  kam:    'Specifies kam (how many?)'
};

const ITEMS = [
  { ar:'يَوماً',    en:'one day',                    r:'time' },
  { ar:'طَويلاً',   en:'a long time',                r:'how' },
  { ar:'عادةً',     en:'usually',                    r:'time' },
  { ar:'مُختَلِفاً', en:'different',                  r:'be' },
  { ar:'قَراراً',   en:'a decision',                 r:'obj' },
  { ar:'كَبيراً',   en:'big',                        r:'agree' },
  { ar:'بَهلَواناً', en:'acrobat / circus performer', r:'become' },
  { ar:'مَرّةً',    en:'times',                      r:'kam' },
  { ar:'شيئاً',     en:'a thing',                    r:'obj' },
  { ar:'شَخصاً',    en:'a person',                   r:'be' },
  { ar:'سَعيداً',   en:'happy',                      r:'agree' },
  { ar:'جَميعاً',   en:'everyone / all together',    r:'how' },
  { ar:'طَبعاً',    en:'of course',                  r:'how' },
  { ar:'دائماً',    en:'always',                     r:'time' },
  { ar:'أَخيراً',   en:'finally',                    r:'time' }
];

const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

let score = 0, answered = 0;
const total = ITEMS.length * 2;
document.getElementById('total').textContent = total;

function buildPassage() {
  const p = document.getElementById('passage');
  p.innerHTML = '';
  const seq = [
    ['w',1],['t',' من الأيّام، صَحَوْتُ مِن النَّوم فَجَلَستُ في سَريري أفَكِّرُ '],['w',2],['t','. '],['w',3],
    ['t','، أبدأ يَومي بالفُطور، ثُمَّ الذَّهاب إلى الشُغل، لكنّ هذا اليَوم كانَ '],['w',4],
    ['t','. في الأمس أخَذتُ '],['w',5],['t',' '],['w',6],
    ['t','. قَرَّرتُ أنْ أقول "مع السلامة" إلى كُلّ زُمَلائي وأنْ أُصبِحَ '],['w',7],
    ['t',' في السيرْك. كَم '],['w',8],
    ['t',' ذَهَبتُ إلى ذلِكَ المَكتَب الحَزين؟ لَنْ أفعَلَ '],['w',9],
    ['t',' آخَر لتِلك الشَرِكة! سَوفَ أكونُ '],['w',10],['t',' '],['w',11],
    ['t',' والناس في السيرْك سوفَ يُحِبّونَني '],['w',12],['t','، '],['w',13],['t','! '],['w',14],
    ['t',' أرَدْتُ أن أفعَلَ هذا، والآن، '],['w',15],['t','، فَعَلتُه.']
  ];
  seq.forEach(([k,v]) => {
    if (k === 't') p.appendChild(document.createTextNode(v));
    else {
      const b = el('button','w');
      b.dataset.i = v-1;
      b.appendChild(el('sup','',v));
      b.appendChild(document.createTextNode(ITEMS[v-1].ar));
      b.addEventListener('click', () => focusCard(v-1));
      p.appendChild(b);
    }
  });
}

function question(card, idx, kind, correct, pool) {
  const wrap = el('div');
  wrap.appendChild(el('div','q-label', kind === 'en' ? 'What does it mean?' : 'Why is it manṣūb?'));
  const opts = el('div','opts');
  const choices = shuffle([correct, ...shuffle(pool.filter(x => x !== correct)).slice(0,3)]);
  let first = true, solved = false;
  choices.forEach(c => {
    const b = el('button','opt', kind === 'en' ? c : REASONS[c]);
    b.addEventListener('click', () => {
      if (solved) return;
      if (c === correct) {
        solved = true;
        b.classList.add('right');
        opts.querySelectorAll('.opt').forEach(o => o.disabled = true);
        answered++;
        if (first) score++;
        update(card, idx);
      } else {
        b.classList.add('wrong'); b.disabled = true; first = false;
      }
    });
    opts.appendChild(b);
  });
  wrap.appendChild(opts);
  card._solved = card._solved || 0;
  card._qs = (card._qs||0) + 1;
  return wrap;
}

function update(card, idx) {
  card._solved++;
  document.getElementById('score').textContent = score;
  if (card._solved === card._qs) {
    document.querySelector('.w[data-i="'+idx+'"]').classList.add('done');
    const next = document.getElementById('c'+(idx+1));
    if (next) setTimeout(() => focusCard(idx+1), 500);
  }
  if (answered === total) {
    const f = document.getElementById('final');
    f.textContent = 'Finished! You got ' + score + ' of ' + total + ' on the first try.';
    f.classList.add('show');
  }
}

function focusCard(i) {
  document.querySelectorAll('.q-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.w').forEach(w => w.classList.remove('active'));
  const c = document.getElementById('c'+i);
  c.classList.add('active');
  document.querySelector('.w[data-i="'+i+'"]').classList.add('active');
  c.scrollIntoView({behavior:'smooth', block:'start'});
}

function build() {
  score = 0; answered = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('final').classList.remove('show');
  buildPassage();
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  const meanings = ITEMS.map(x => x.en);
  const reasons = Object.keys(REASONS);
  ITEMS.forEach((it, i) => {
    const card = el('div','q-card');
    card.id = 'c'+i;
    const head = el('div','q-head');
    head.appendChild(el('span','q-num', (i+1)+' / '+ITEMS.length));
    head.appendChild(el('span','q-word', it.ar));
    card.appendChild(head);
    card.appendChild(question(card, i, 'en', it.en, meanings));
    card.appendChild(question(card, i, 'why', it.r, reasons));
    cards.appendChild(card);
  });
}

document.getElementById('reset').addEventListener('click', () => { build(); window.scrollTo({top:0, behavior:'smooth'}); });
build();
</script>
</body>
</html>
